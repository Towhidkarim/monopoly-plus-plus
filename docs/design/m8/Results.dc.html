<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Game over</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=Manrope:wght@400;600;800&amp;family=Sora:wght@600;700&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          position: relative;
          width: 1440px;
          height: 900px;
          overflow: hidden;
          background: #0a1222;
          color: #f4ede2;
          font-family: 'Manrope', system-ui, sans-serif;
        "
      >
        <img
          src="/_blob/282b5fd59a8a364586baba3721257d1f"
          alt="The board at night"
          style="position: absolute; left: 230px; top: 90px; width: 980px; height: 833px; object-fit: contain"
        />
        <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(6, 10, 20, 0.74)"></div>
        <sc-for list="{{confetti}}" as="c" hint-placeholder-count="20">
          <span
            aria-hidden="true"
            style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: {{c.w}}px; height: {{c.h}}px; border-radius: 2px; background: {{c.color}}; transform: rotate({{c.r}}deg); opacity: 0.85"
          ></span>
        </sc-for>

        <div
          role="dialog"
          aria-label="Game over"
          style="
            position: absolute;
            left: 50%;
            top: 56px;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-start;
            gap: 36px;
          "
        >
          <article
            style="
              position: relative;
              width: 440px;
              transform: rotate(-1.5deg);
              background: #fbf8f1;
              color: #1f2a3d;
              border-radius: 20px;
              box-shadow:
                0 30px 70px rgba(2, 6, 16, 0.7),
                0 3px 0 #e4dccb;
              font-family: 'DM Sans', sans-serif;
              overflow: hidden;
            "
          >
            <div
              aria-hidden="true"
              style="position: absolute; inset: 10px; border-radius: 13px; border: 2px solid #c8962a"
            ></div>
            <div
              aria-hidden="true"
              style="
                position: absolute;
                inset: 15px;
                border-radius: 10px;
                border: 1px solid rgba(200, 150, 42, 0.4);
              "
            ></div>
            <div
              style="
                padding: 38px 40px 34px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                text-align: center;
              "
            >
              <span
                style="
                  font-family: 'Bricolage Grotesque', sans-serif;
                  font-size: 13px;
                  font-weight: 800;
                  letter-spacing: 0.24em;
                  text-transform: uppercase;
                  color: #9a7322;
                "
                >Game over · Round 30</span
              >
              <div style="position: relative; width: 110px; height: 110px; margin: 6px 0">
                <svg
                  width="110"
                  height="110"
                  viewBox="0 0 110 110"
                  aria-hidden="true"
                  style="position: absolute; inset: 0"
                >
                  <path
                    d="M55 4 L63 14 L76 10 L79 23 L92 26 L89 39 L100 47 L92 57 L98 69 L86 74 L86 88 L73 87 L66 99 L55 92 L44 99 L37 87 L24 88 L24 74 L12 69 L18 57 L10 47 L21 39 L18 26 L31 23 L34 10 L47 14 Z"
                    fill="#f2c14e"
                  ></path>
                </svg>
                <span
                  style="
                    position: absolute;
                    left: 17px;
                    top: 17px;
                    width: 76px;
                    height: 76px;
                    border-radius: 50%;
                    background: #fbbf24;
                    border: 4px solid #fbf8f1;
                    box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.18);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                  "
                  ><svg width="38" height="38" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M5 4 H19 V17 H5 Z M5 11 H19 M8 17 V20 M16 17 V20"
                      fill="none"
                      stroke="#1a1020"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path></svg
                ></span>
              </div>
              <span style="font-size: 14px; color: #5a6373">The city has a new mayor</span>
              <h2
                style="
                  margin: 0;
                  font-family: 'Bricolage Grotesque', sans-serif;
                  font-size: 46px;
                  font-weight: 800;
                  line-height: 1;
                "
              >
                Atlas won!
              </h2>
              <span
                style="
                  font-family: 'Bricolage Grotesque', sans-serif;
                  font-size: 22px;
                  font-weight: 800;
                  color: #1d7354;
                "
                >Net worth ₵4,820</span
              >
              <div style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center">
                <span
                  style="
                    padding: 6px 10px;
                    border-radius: 999px;
                    background: #f0eadc;
                    font-size: 12px;
                    font-weight: 700;
                  "
                  >3 hotels built</span
                >
                <span
                  style="
                    padding: 6px 10px;
                    border-radius: 999px;
                    background: #f0eadc;
                    font-size: 12px;
                    font-weight: 700;
                  "
                  >₵2,310 rent collected</span
                >
                <span
                  style="
                    padding: 6px 10px;
                    border-radius: 999px;
                    background: #f0eadc;
                    font-size: 12px;
                    font-weight: 700;
                  "
                  >Owned Uptown</span
                >
              </div>
            </div>
            <div
              aria-hidden="true"
              style="
                position: absolute;
                right: 26px;
                bottom: 26px;
                width: 74px;
                height: 74px;
                border-radius: 50%;
                border: 3px solid rgba(180, 35, 24, 0.75);
                color: rgba(180, 35, 24, 0.85);
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                font-family: 'Sora', sans-serif;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.1em;
                transform: rotate(-14deg);
              "
            >
              CITY<br />HALL
            </div>
          </article>

          <section
            style="
              width: 420px;
              display: flex;
              flex-direction: column;
              gap: 16px;
              padding: 24px;
              border-radius: 24px;
              background: #121c33;
              border: 1px solid rgba(255, 214, 150, 0.16);
              box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 28px 60px rgba(2, 6, 16, 0.65);
            "
          >
            <span
              style="
                font-size: 12px;
                font-weight: 800;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: #a8b1c4;
              "
              >Final standings</span
            >
            <div
              style="display: flex; align-items: flex-end; justify-content: center; gap: 10px; height: 170px"
            >
              <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
                <div
                  style="width: 104px; display: flex; flex-direction: column; align-items: center; gap: 8px"
                >
                  <span
                    style="width: 40px; height: 40px; border-radius: 50%; background: {{p.color}}; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center"
                    ><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                      <path
                        d="{{p.icon}}"
                        fill="none"
                        stroke="#1a1020"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      ></path></svg
                  ></span>
                  <div
                    style="width: 100%; height: {{p.h}}px; border-radius: 12px 12px 4px 4px; background: {{p.block}}; box-shadow: inset 0 2px 0 rgba(255,255,255,0.25), inset 0 -6px 0 rgba(0,0,0,0.15); display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; box-sizing: border-box; font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 700; color: #1c1205"
                  >
                    {{p.place}}
                  </div>
                </div>
              </sc-for>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
                <div
                  style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: {{r.bg}}"
                >
                  <span style="width: 22px; font-family: 'Sora', sans-serif; font-weight: 700; color: #a8b1c4"
                    >{{r.rank}}</span
                  >
                  <span style="width: 12px; height: 12px; border-radius: 50%; background: {{r.color}}"></span>
                  <span style="flex: 1; font-weight: 800">{{r.name}}</span>
                  <span style="font-family: 'Sora', sans-serif; font-weight: 700; color: {{r.ink}}"
                    >{{r.worth}}</span
                  >
                </div>
              </sc-for>
            </div>
            <div style="display: flex; gap: 10px">
              <button
                type="button"
                style="
                  flex: 1;
                  height: 56px;
                  border-radius: 16px;
                  border: 0;
                  background: #f5b54a;
                  color: #1c1205;
                  font-family: 'Sora', sans-serif;
                  font-size: 17px;
                  font-weight: 700;
                  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18);
                "
              >
                Play again
              </button>
              <button
                type="button"
                style="
                  height: 56px;
                  padding: 0 18px;
                  border-radius: 16px;
                  border: 1px solid rgba(255, 214, 150, 0.2);
                  background: transparent;
                  color: #f4ede2;
                  font-family: 'Manrope', sans-serif;
                  font-size: 15px;
                  font-weight: 800;
                "
              >
                New game setup
              </button>
            </div>
          </section>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
      class Component extends DCLogic {
        renderVals() {
          const icons = {
            taxi: 'M4 16 L5.5 11 H18.5 L20 16 V19 H4 Z M7 19 V21 M17 19 V21 M9 8 H15 V11 H9 Z',
            drone: 'M12 10 V14 M8 12 H16 M4 8 H8 M16 8 H20 M6 8 V11 L9 12 M18 8 V11 L15 12',
            bus: 'M5 4 H19 V17 H5 Z M5 11 H19 M8 17 V20 M16 17 V20'
          };
          const podium = [
            { place: '2', h: 84, color: '#fb7185', icon: icons.taxi, block: '#c9d1dc' },
            { place: '1', h: 116, color: '#fbbf24', icon: icons.bus, block: '#f2c14e' },
            { place: '3', h: 62, color: '#22d3ee', icon: icons.drone, block: '#d99a6c' }
          ];
          const rows = [
            { rank: '1', name: 'Atlas', color: '#fbbf24', worth: '₵4,820', ink: '#ffcf70', bg: 'rgba(245,181,74,0.1)' },
            { rank: '2', name: 'You', color: '#fb7185', worth: '₵3,140', ink: '#f4ede2', bg: 'rgba(255,255,255,0.03)' },
            { rank: '3', name: 'Nova', color: '#22d3ee', worth: '₵2,560', ink: '#f4ede2', bg: 'rgba(255,255,255,0.03)' },
            { rank: '4', name: 'Juno', color: '#a78bfa', worth: 'Bankrupt', ink: '#fda4af', bg: 'rgba(251,113,133,0.06)' }
          ];
          const colors = ['#f5b54a', '#fb7185', '#5eead4', '#7dd3fc', '#a78bfa', '#fbf8f1'];
          const confetti = Array.from({ length: 36 }, (_, i) => ({
            x: (i * 151 + 37) % 1420,
            y: (i * 97 + 11) % 880,
            w: 6 + (i % 3) * 3,
            h: 10 + (i % 4) * 3,
            r: (i * 47) % 180,
            color: colors[i % colors.length]
          }));
          return { podium, rows, confetti };
        }
      }
    </script>
  </body>
</html>
