<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Top bar</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=Manrope:wght@400;600;800&amp;family=Sora:wght@600;700&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <header
        style="
          width: 1440px;
          height: 96px;
          padding: 16px 20px;
          box-sizing: border-box;
          display: flex;
          align-items: flex-start;
          gap: 16px;
          color: #f4ede2;
          font-family: 'Manrope', system-ui, sans-serif;
        "
      >
        <div style="width: 200px; display: flex; flex-direction: column; gap: 8px">
          <span
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              font-family: 'Sora', sans-serif;
              font-size: 24px;
              font-weight: 700;
            "
          >
            <svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true">
              <path
                d="M1 21 V13 H6 V21 M8 21 V5 H14 V21 M16 21 V9 H21 V21 M23 21 V15 H25"
                fill="none"
                stroke="#f5b54a"
                stroke-width="2"
                stroke-linejoin="round"
              ></path>
              <circle cx="11" cy="9" r="1" fill="#ffcf70"></circle>
              <circle cx="11" cy="13" r="1" fill="#ffcf70"></circle>
              <circle cx="18.5" cy="13" r="1" fill="#ffcf70"></circle></svg
            >Skyline</span
          >
          <span style="display: flex; gap: 6px">
            <span
              style="
                padding: 3px 10px;
                border-radius: 999px;
                background: #121c33;
                border: 1px solid rgba(255, 214, 150, 0.16);
                font-size: 12px;
                font-weight: 700;
              "
              >Standard</span
            >
            <span
              style="
                padding: 3px 10px;
                border-radius: 999px;
                background: #121c33;
                border: 1px solid rgba(255, 214, 150, 0.16);
                font-size: 12px;
                font-weight: 700;
              "
              >Round 9 <span style="color: #a8b1c4">/ 30</span></span
            >
          </span>
        </div>
        <div style="flex: 1; display: flex; justify-content: center; gap: 10px">
          <sc-for list="{{players}}" as="pl" hint-placeholder-count="4">
            <div
              style="position: relative; width: 214px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 16px; background: {{pl.bg}}; border: 1.5px solid {{pl.border}}; box-shadow: {{pl.shadow}}; opacity: {{pl.dim}}"
            >
              <div style="display: flex; align-items: center; gap: 10px">
                <span
                  style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: {{pl.color}}; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18), 0 0 0 2px {{pl.halo}}; display: flex; align-items: center; justify-content: center"
                >
                  <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="{{pl.icon}}"
                      fill="none"
                      stroke="#1a1020"
                      stroke-width="2.2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path></svg
                ></span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                  <span style="font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700"
                    >{{pl.name}}</span
                  >
                  <span
                    style="font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: {{pl.tagInk}}"
                    >{{pl.tag}}</span
                  >
                </span>
                <span
                  style="font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{pl.cashInk}}"
                  >₵{{pl.cash}}</span
                >
              </div>
              <div style="display: flex; gap: 3px">
                <sc-for list="{{pl.sets}}" as="st" hint-placeholder-count="8">
                  <span
                    style="flex: 1; height: 5px; border-radius: 3px; background: {{st.c}}; opacity: {{st.a}}"
                  ></span>
                </sc-for>
              </div>
              <sc-if value="{{pl.active}}" hint-placeholder-val="{{false}}">
                <span
                  aria-hidden="true"
                  style="
                    position: absolute;
                    left: 16px;
                    right: 16px;
                    bottom: -1px;
                    height: 3px;
                    border-radius: 3px;
                    background: #f5b54a;
                    box-shadow: 0 0 12px rgba(245, 181, 74, 0.7);
                  "
                ></span>
              </sc-if>
            </div>
          </sc-for>
        </div>
        <div style="width: 200px; display: flex; justify-content: flex-end; gap: 8px">
          <button
            type="button"
            aria-label="Game speed"
            style="
              width: 44px;
              height: 44px;
              border-radius: 14px;
              background: #121c33;
              border: 1px solid rgba(255, 214, 150, 0.16);
              box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
              color: #f4ede2;
              font-family: 'Sora', sans-serif;
              font-weight: 700;
              font-size: 13px;
            "
          >
            1×
          </button>
          <button
            type="button"
            aria-label="Sound on"
            style="
              width: 44px;
              height: 44px;
              border-radius: 14px;
              background: #121c33;
              border: 1px solid rgba(255, 214, 150, 0.16);
              box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path
                d="M2 7 H5 L9 3 V15 L5 11 H2 Z M12 6 A4 4 0 0 1 12 12 M14 4 A7 7 0 0 1 14 14"
                fill="none"
                stroke="#f4ede2"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </svg>
          </button>
          <button
            type="button"
            aria-label="Help and rules"
            style="
              width: 44px;
              height: 44px;
              border-radius: 14px;
              background: #121c33;
              border: 1px solid rgba(255, 214, 150, 0.16);
              box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
              color: #f4ede2;
              font-family: 'Sora', sans-serif;
              font-weight: 700;
              font-size: 16px;
            "
          >
            ?
          </button>
          <button
            type="button"
            aria-label="Menu"
            style="width: 44px; height: 44px; border-radius: 14px; background: {{menuBg}}; border: 1px solid {{menuBorder}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center"
          >
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path
                d="M3 5 H15 M3 9 H15 M3 13 H15"
                stroke="#f4ede2"
                stroke-width="1.8"
                stroke-linecap="round"
              ></path>
            </svg>
          </button>
        </div>
      </header>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"active":{"editor":"enum","options":["you","nova","atlas","juno","none"],"default":"you"},"menuOpen":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":96}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const groups = ['#a78bfa', '#7dd3fc', '#f472b6', '#fb923c', '#f87171', '#fbbf24', '#34d399', '#6366f1'];
          const sets = (owned) => groups.map((c, i) => ({ c, a: owned[i] ?? 0.14 }));
          const icons = {
            taxi: 'M4 16 L5.5 11 H18.5 L20 16 V19 H4 Z M7 19 V21 M17 19 V21 M9 8 H15 V11 H9 Z',
            drone: 'M12 10 V14 M8 12 H16 M4 8 H8 M16 8 H20 M6 8 V11 L9 12 M18 8 V11 L15 12',
            balloon: 'M12 3 A6 6 0 0 1 18 9 C18 13 14 16 12 17 C10 16 6 13 6 9 A6 6 0 0 1 12 3 Z M10.5 17 L11 20 H13 L13.5 17',
            bus: 'M5 4 H19 V17 H5 Z M5 11 H19 M8 17 V20 M16 17 V20'
          };
          const active = this.props.active ?? 'you';
          const base = { bg: '#121c33', border: 'rgba(255,214,150,0.12)', shadow: 'inset 0 1px 0 rgba(255,255,255,0.06)', halo: 'rgba(255,255,255,0.1)', tagInk: '#a8b1c4', cashInk: '#ffcf70', active: false, dim: 1 };
          const on = { active: true, bg: '#16213d', border: '#f5b54a', shadow: 'inset 0 1px 0 rgba(255,255,255,0.08), 0 0 0 4px rgba(245,181,74,0.14)', halo: 'rgba(245,181,74,0.6)', tagInk: '#f5b54a' };
          const players = [
            { ...base, id: 'you', name: 'You', tag: active === 'you' ? 'Your turn' : 'Human', color: '#fb7185', icon: icons.taxi, cash: '1,290', sets: sets({ 1: 1, 3: 0.5 }) },
            { ...base, id: 'nova', name: 'Nova', tag: 'In Lockup', tagInk: '#fda4af', color: '#22d3ee', icon: icons.drone, cash: '1,425', sets: sets({ 0: 0.5, 7: 0.5 }) },
            { ...base, id: 'atlas', name: 'Atlas', tag: active === 'atlas' ? 'Thinking…' : 'Tycoon bot', color: '#fbbf24', icon: icons.bus, cash: '1,044', sets: sets({ 5: 0.5, 6: 1 }) },
            { ...base, id: 'juno', name: 'Juno', tag: 'Low cash', tagInk: '#fda4af', cashInk: '#fb7185', border: 'rgba(251,113,133,0.45)', color: '#a78bfa', icon: icons.balloon, cash: '64', sets: sets({ 4: 0.5, 2: 0.5 }) }
          ].map((p) => (p.id === active ? { ...p, ...on, tagInk: '#f5b54a' } : p));
          const menuOpen = this.props.menuOpen ?? false;
          return { players, menuBg: menuOpen ? '#f5b54a' : '#121c33', menuBorder: menuOpen ? '#f5b54a' : 'rgba(255,214,150,0.16)' };
        }
      }
    </script>
  </body>
</html>
