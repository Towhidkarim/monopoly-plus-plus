<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Auction</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=Manrope:wght@400;600;800&amp;family=Sora:wght@600;700&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          position: relative;
          width: 1440px;
          height: 900px;
          overflow: hidden;
          background: #0a1222;
          color: #f4ede2;
          font-family: 'Manrope', system-ui, sans-serif;
        "
      >
        <img
          src="/_blob/282b5fd59a8a364586baba3721257d1f"
          alt="The board at night"
          style="position: absolute; left: 230px; top: 90px; width: 980px; height: 833px; object-fit: contain"
        />
        <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(6, 10, 20, 0.55)"></div>
        <div style="position: absolute; left: 0; top: 0">
          <dc-import name="Hud" active="you" hint-size="1440px,96px"></dc-import>
        </div>

        <section
          role="dialog"
          aria-label="Auction for Opera Lane"
          style="
            position: absolute;
            left: 50%;
            top: 124px;
            width: 780px;
            transform: translateX(-50%);
            border-radius: 26px;
            background: #121c33;
            border: 1px solid rgba(255, 214, 150, 0.16);
            box-shadow:
              inset 0 1px 0 rgba(255, 255, 255, 0.08),
              0 30px 60px rgba(2, 6, 16, 0.65);
            overflow: hidden;
          "
        >
          <div
            style="
              display: flex;
              align-items: center;
              gap: 22px;
              padding: 22px 26px;
              background: rgba(255, 255, 255, 0.025);
              border-bottom: 1px solid rgba(255, 214, 150, 0.1);
            "
          >
            <div style="transform: rotate(-4deg); flex: none">
              <dc-import
                name="RichDeed"
                compact="{{true}}"
                street="Opera Lane"
                group="Theater"
                color="#f87171"
                ink="#3a0c0c"
                price="{{240}}"
                level="{{0}}"
                owned="{{false}}"
                night="{{true}}"
                hint-size="140px,182px"
              ></dc-import>
            </div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
              <span
                style="
                  display: flex;
                  align-items: center;
                  gap: 8px;
                  font-size: 12px;
                  font-weight: 800;
                  letter-spacing: 0.16em;
                  text-transform: uppercase;
                  color: #f5b54a;
                "
              >
                <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                  <path
                    d="M3 9 L9 3 M6 12 L12 6 M5 7 L9 11 M10 12 L14 16 M1 15 H8"
                    fill="none"
                    stroke="#f5b54a"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  ></path></svg
                >Auction</span
              >
              <h2 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 30px; font-weight: 700">
                Opera Lane
              </h2>
              <span style="font-size: 14px; color: #a8b1c4">List price ₵240 · Theater, 1 of 3</span>
              <span
                style="
                  margin-top: 6px;
                  display: flex;
                  flex-wrap: wrap;
                  gap: 6px;
                  font-size: 12px;
                  color: #a8b1c4;
                "
              >
                <span style="padding: 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.05)"
                  >You ₵100</span
                >
                <span style="padding: 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.05)"
                  >Atlas ₵120</span
                >
                <span
                  style="
                    padding: 3px 8px;
                    border-radius: 999px;
                    background: rgba(245, 181, 74, 0.16);
                    color: #ffcf70;
                    font-weight: 700;
                  "
                  >Juno ₵140</span
                >
              </span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
              <div style="position: relative; width: 76px; height: 76px">
                <svg width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="4 seconds left">
                  <circle
                    cx="38"
                    cy="38"
                    r="32"
                    fill="none"
                    stroke="rgba(255,255,255,0.08)"
                    stroke-width="7"
                  ></circle>
                  <circle
                    cx="38"
                    cy="38"
                    r="32"
                    fill="none"
                    stroke="#f5b54a"
                    stroke-width="7"
                    stroke-linecap="round"
                    stroke-dasharray="121 201"
                    transform="rotate(-90 38 38)"
                  ></circle>
                </svg>
                <span
                  style="
                    position: absolute;
                    inset: 0;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-family: 'Sora', sans-serif;
                    font-weight: 700;
                    font-size: 24px;
                  "
                  >4</span
                >
              </div>
              <span style="font-size: 11px; color: #a8b1c4">seconds left</span>
            </div>
          </div>

          <div
            style="display: flex; align-items: center; justify-content: space-between; padding: 20px 26px 6px"
          >
            <span style="display: flex; align-items: center; gap: 12px">
              <span
                style="
                  width: 44px;
                  height: 44px;
                  border-radius: 50%;
                  background: #a78bfa;
                  box-shadow:
                    inset 0 -3px 0 rgba(0, 0, 0, 0.18),
                    0 0 0 4px rgba(245, 181, 74, 0.55),
                    0 0 22px rgba(245, 181, 74, 0.35);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
              >
                <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 3 A6 6 0 0 1 18 9 C18 13 14 16 12 17 C10 16 6 13 6 9 A6 6 0 0 1 12 3 Z M10.5 17 L11 20 H13 L13.5 17"
                    fill="none"
                    stroke="#1a1020"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path></svg
              ></span>
              <span style="display: flex; flex-direction: column">
                <span style="font-size: 12px; color: #a8b1c4">High bid</span>
                <span style="font-size: 16px; font-weight: 800">Juno leads</span>
              </span>
            </span>
            <span
              style="
                font-family: 'Sora', sans-serif;
                font-size: 52px;
                font-weight: 700;
                color: #ffcf70;
                text-shadow: 0 0 24px rgba(255, 207, 112, 0.4);
              "
              >₵140</span
            >
          </div>

          <div
            style="
              display: grid;
              grid-template-columns: repeat(4, minmax(0, 1fr));
              gap: 10px;
              padding: 12px 26px;
            "
          >
            <sc-for list="{{bidders}}" as="b" hint-placeholder-count="4">
              <div
                style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 10px; border-radius: 18px; background: {{b.bg}}; border: 1.5px solid {{b.border}}; opacity: {{b.dim}}"
              >
                <span
                  style="width: 38px; height: 38px; border-radius: 50%; background: {{b.color}}; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center"
                >
                  <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="{{b.icon}}"
                      fill="none"
                      stroke="#1a1020"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path></svg
                ></span>
                <span style="font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700"
                  >{{b.name}}</span
                >
                <span
                  style="padding: 4px 10px; border-radius: 999px; background: {{b.pillBg}}; color: {{b.pillInk}}; font-size: 11px; font-weight: 800"
                  >{{b.status}}</span
                >
              </div>
            </sc-for>
          </div>

          <div
            style="
              margin: 6px 26px 0;
              display: flex;
              align-items: center;
              gap: 10px;
              padding: 12px 14px;
              border-radius: 14px;
              background: rgba(248, 113, 113, 0.1);
              border: 1px solid rgba(248, 113, 113, 0.3);
              font-size: 13px;
            "
          >
            <span
              style="width: 12px; height: 12px; border-radius: 3px; background: #f87171; flex: none"
            ></span>
            Opera Lane would give you 1 of 3 Theater. Juno holds Gallery Walk, so winning it also blocks Juno.
          </div>

          <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px 26px 24px">
            <span
              style="
                font-size: 12px;
                font-weight: 800;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: #a8b1c4;
              "
              >Your bid · you have <span style="color: #ffcf70">₵1,290</span></span
            >
            <div style="display: flex; gap: 10px">
              <sc-for list="{{raises}}" as="r" hint-placeholder-count="4">
                <button
                  type="button"
                  style="
                    flex: 1;
                    height: 56px;
                    border-radius: 16px;
                    border: 0;
                    background: #f5b54a;
                    color: #1c1205;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    gap: 0;
                    box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18);
                  "
                >
                  <span style="font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 700"
                    >{{r.bid}}</span
                  >
                  <span style="font-size: 11px; font-weight: 800; opacity: 0.7">{{r.step}}</span>
                </button>
              </sc-for>
              <label
                style="
                  flex: 1.3;
                  display: flex;
                  align-items: center;
                  gap: 6px;
                  height: 56px;
                  box-sizing: border-box;
                  padding: 0 14px;
                  border-radius: 16px;
                  background: #0a1222;
                  border: 1px solid rgba(255, 214, 150, 0.2);
                "
              >
                <span style="font-family: 'Sora', sans-serif; color: #a8b1c4">₵</span>
                <input
                  type="text"
                  aria-label="Custom bid"
                  placeholder="Custom"
                  style="
                    width: 100%;
                    border: 0;
                    outline: none;
                    background: transparent;
                    color: #f4ede2;
                    font-family: 'Sora', sans-serif;
                    font-size: 17px;
                  "
                />
              </label>
              <button
                type="button"
                style="
                  width: 92px;
                  height: 56px;
                  border-radius: 16px;
                  border: 1px solid rgba(255, 214, 150, 0.2);
                  background: transparent;
                  color: #f4ede2;
                  font-family: 'Manrope', sans-serif;
                  font-size: 15px;
                  font-weight: 800;
                "
              >
                Pass
              </button>
            </div>
          </div>
        </section>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
      class Component extends DCLogic {
        renderVals() {
          const icons = {
            taxi: 'M4 16 L5.5 11 H18.5 L20 16 V19 H4 Z M7 19 V21 M17 19 V21 M9 8 H15 V11 H9 Z',
            drone: 'M12 10 V14 M8 12 H16 M4 8 H8 M16 8 H20 M6 8 V11 L9 12 M18 8 V11 L15 12',
            balloon: 'M12 3 A6 6 0 0 1 18 9 C18 13 14 16 12 17 C10 16 6 13 6 9 A6 6 0 0 1 12 3 Z M10.5 17 L11 20 H13 L13.5 17',
            bus: 'M5 4 H19 V17 H5 Z M5 11 H19 M8 17 V20 M16 17 V20'
          };
          const base = { bg: 'rgba(255,255,255,0.03)', border: 'rgba(255,214,150,0.1)', dim: 1, pillBg: 'rgba(255,255,255,0.07)', pillInk: '#a8b1c4' };
          const bidders = [
            { ...base, name: 'You', color: '#fb7185', icon: icons.taxi, status: 'Your bid', border: '#f5b54a', bg: 'rgba(245,181,74,0.08)', pillBg: '#f5b54a', pillInk: '#1c1205' },
            { ...base, name: 'Nova', color: '#22d3ee', icon: icons.drone, status: 'Passed', dim: 0.45 },
            { ...base, name: 'Atlas', color: '#fbbf24', icon: icons.bus, status: 'Thinking…' },
            { ...base, name: 'Juno', color: '#a78bfa', icon: icons.balloon, status: 'Leading ₵140', border: 'rgba(245,181,74,0.45)', pillBg: 'rgba(245,181,74,0.18)', pillInk: '#ffcf70' }
          ];
          const raises = [
            { bid: '₵150', step: '+10' },
            { bid: '₵165', step: '+25' },
            { bid: '₵190', step: '+50' },
            { bid: '₵240', step: 'list price' }
          ];
          return { bidders, raises };
        }
      }
    </script>
  </body>
</html>
