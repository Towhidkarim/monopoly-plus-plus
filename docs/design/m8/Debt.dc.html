<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Raise money</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=Manrope:wght@400;600;800&amp;family=Sora:wght@600;700&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          position: relative;
          width: 1440px;
          height: 900px;
          overflow: hidden;
          background: #0a1222;
          color: #f4ede2;
          font-family: 'Manrope', system-ui, sans-serif;
        "
      >
        <img
          src="/_blob/282b5fd59a8a364586baba3721257d1f"
          alt="The board at night"
          style="position: absolute; left: 230px; top: 90px; width: 980px; height: 833px; object-fit: contain"
        />
        <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20, 6, 12, 0.6)"></div>
        <div style="position: absolute; left: 0; top: 0">
          <dc-import name="Hud" active="you" hint-size="1440px,96px"></dc-import>
        </div>

        <div
          role="dialog"
          aria-label="Raise money to pay Atlas"
          style="
            position: absolute;
            left: 50%;
            top: 128px;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-start;
            gap: 36px;
          "
        >
          <article
            aria-label="Bill"
            style="
              position: relative;
              width: 290px;
              margin-top: 30px;
              transform: rotate(-3deg);
              background: #fbf8f1;
              color: #1f2a3d;
              border-radius: 6px 6px 16px 16px;
              box-shadow: 0 24px 50px rgba(2, 6, 16, 0.6);
              font-family: 'DM Sans', sans-serif;
            "
          >
            <div
              aria-hidden="true"
              style="
                height: 14px;
                background-image: radial-gradient(circle at 7px 0, #0a1222 5px, rgba(0, 0, 0, 0) 5.5px);
                background-size: 14px 14px;
                background-repeat: repeat-x;
              "
            ></div>
            <div style="padding: 10px 24px 24px; display: flex; flex-direction: column; gap: 14px">
              <span style="display: flex; align-items: center; justify-content: space-between">
                <span
                  style="
                    font-family: 'Bricolage Grotesque', sans-serif;
                    font-size: 13px;
                    font-weight: 800;
                    letter-spacing: 0.2em;
                    text-transform: uppercase;
                    color: #5a6373;
                  "
                  >Rent due</span
                >
                <span style="font-size: 11px; color: #7a8293">Round 9</span>
              </span>
              <span style="display: flex; align-items: center; gap: 10px">
                <span
                  style="
                    width: 40px;
                    height: 40px;
                    border-radius: 50%;
                    background: #fbbf24;
                    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                  "
                  ><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M5 4 H19 V17 H5 Z M5 11 H19 M8 17 V20 M16 17 V20"
                      fill="none"
                      stroke="#1a1020"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path></svg
                ></span>
                <span style="display: flex; flex-direction: column">
                  <span style="font-size: 12px; color: #5a6373">Pay to</span>
                  <span
                    style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800"
                    >Atlas</span
                  >
                </span>
              </span>
              <div
                style="
                  display: flex;
                  flex-direction: column;
                  gap: 6px;
                  padding: 12px 0;
                  border-top: 1px dashed #d8cfbb;
                  border-bottom: 1px dashed #d8cfbb;
                  font-size: 13px;
                "
              >
                <span style="display: flex; justify-content: space-between"
                  ><span>Tech Boulevard · 2 houses</span><span style="font-weight: 700">₵150</span></span
                >
                <span style="display: flex; justify-content: space-between; color: #5a6373"
                  ><span>Your cash</span><span>₵109</span></span
                >
              </div>
              <span style="display: flex; align-items: baseline; justify-content: space-between">
                <span style="font-size: 13px; font-weight: 700; color: #b42318">Still short</span>
                <span
                  style="
                    font-family: 'Bricolage Grotesque', sans-serif;
                    font-size: 34px;
                    font-weight: 800;
                    color: #b42318;
                  "
                  >₵41</span
                >
              </span>
            </div>
            <div
              aria-hidden="true"
              style="
                position: absolute;
                right: 18px;
                top: 62px;
                padding: 4px 12px;
                border: 3px solid #b42318;
                border-radius: 8px;
                color: #b42318;
                font-family: 'Sora', sans-serif;
                font-weight: 700;
                font-size: 18px;
                letter-spacing: 0.14em;
                transform: rotate(12deg);
                opacity: 0.85;
              "
            >
              DUE
            </div>
          </article>

          <section
            style="
              width: 560px;
              display: flex;
              flex-direction: column;
              border-radius: 24px;
              background: #121c33;
              border: 1px solid rgba(251, 113, 133, 0.4);
              box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 0 4px rgba(251, 113, 133, 0.08),
                0 28px 60px rgba(2, 6, 16, 0.65);
              overflow: hidden;
            "
          >
            <div style="padding: 22px 24px 16px; display: flex; flex-direction: column; gap: 14px">
              <span
                style="
                  font-size: 12px;
                  font-weight: 800;
                  letter-spacing: 0.14em;
                  text-transform: uppercase;
                  color: #fda4af;
                "
                >You owe Atlas ₵150 rent</span
              >
              <h2 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 32px; font-weight: 700">
                Raise ₵41 to pay
              </h2>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div
                  style="
                    position: relative;
                    height: 16px;
                    border-radius: 8px;
                    background: rgba(255, 255, 255, 0.06);
                    overflow: hidden;
                  "
                >
                  <span
                    style="position: absolute; left: 0; top: 0; bottom: 0; width: 18%; background: #f5b54a"
                  ></span>
                  <span
                    style="
                      position: absolute;
                      left: 18%;
                      top: 0;
                      bottom: 0;
                      width: 70%;
                      background-image: repeating-linear-gradient(
                        135deg,
                        rgba(94, 234, 212, 0.55) 0 6px,
                        rgba(94, 234, 212, 0.2) 6px 12px
                      );
                    "
                  ></span>
                  <span
                    style="
                      position: absolute;
                      left: 25%;
                      top: -2px;
                      bottom: -2px;
                      width: 3px;
                      background: #fbf8f1;
                      box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
                    "
                  ></span>
                </div>
                <span style="display: flex; justify-content: space-between; font-size: 12px; color: #a8b1c4"
                  ><span><strong style="color: #ffcf70">Cash ₵109</strong></span
                  ><span>Owed ₵150 │</span
                  ><span>Everything below <strong style="color: #5eead4">+₵1,050</strong></span></span
                >
              </div>
            </div>
            <div style="display: flex; flex-direction: column; padding: 0 12px">
              <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
                <div
                  style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: {{o.bg}}"
                >
                  <span
                    style="
                      width: 28px;
                      height: 36px;
                      border-radius: 5px;
                      background: #fbf8f1;
                      overflow: hidden;
                      flex: none;
                      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
                    "
                    ><span style="display: block; height: 11px; background: {{o.color}}"></span
                  ></span>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                    <span style="font-size: 14px; font-weight: 800">{{o.title}}</span>
                    <span style="font-size: 12px; color: #a8b1c4">{{o.detail}}</span>
                  </span>
                  <button
                    type="button"
                    style="
                      height: 40px;
                      padding: 0 14px;
                      border-radius: 12px;
                      border: 1px solid rgba(94, 234, 212, 0.5);
                      background: rgba(94, 234, 212, 0.1);
                      color: #5eead4;
                      font-family: 'Sora', sans-serif;
                      font-size: 15px;
                      font-weight: 700;
                    "
                  >
                    +₵{{o.amount}}
                  </button>
                </div>
              </sc-for>
            </div>
            <div style="display: flex; gap: 10px; padding: 18px 24px 22px; align-items: center">
              <button
                type="button"
                style="
                  flex: 1;
                  height: 56px;
                  border-radius: 16px;
                  border: 0;
                  background: #f5b54a;
                  color: #1c1205;
                  font-family: 'Sora', sans-serif;
                  font-size: 16px;
                  font-weight: 700;
                  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18);
                "
              >
                Raise ₵41 automatically
              </button>
              <button
                type="button"
                style="
                  height: 56px;
                  padding: 0 18px;
                  border-radius: 16px;
                  border: 1px solid rgba(255, 214, 150, 0.2);
                  background: transparent;
                  color: #f4ede2;
                  font-family: 'Manrope', sans-serif;
                  font-size: 15px;
                  font-weight: 800;
                "
              >
                Offer a trade
              </button>
              <button
                type="button"
                style="
                  height: 56px;
                  padding: 0 14px;
                  border-radius: 16px;
                  border: 0;
                  background: transparent;
                  color: #fda4af;
                  font-family: 'Manrope', sans-serif;
                  font-size: 14px;
                  font-weight: 800;
                  text-decoration: underline;
                  text-underline-offset: 4px;
                "
              >
                Go bankrupt
              </button>
            </div>
          </section>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
      class Component extends DCLogic {
        renderVals() {
          const options = [
            { title: 'Mortgage Harbor Row', detail: 'Docks · earns no rent while mortgaged', amount: 30, color: '#a78bfa', bg: 'rgba(94,234,212,0.06)' },
            { title: 'Sell a house on Foundry Way', detail: 'Old Town · rent drops to ₵40 (now ₵100)', amount: 25, color: '#7dd3fc', bg: 'transparent' },
            { title: 'Sell a house on Mill Avenue', detail: 'Old Town · rent drops to ₵30 (now ₵90)', amount: 25, color: '#7dd3fc', bg: 'transparent' },
            { title: 'Mortgage Market Street', detail: 'Market · earns no rent while mortgaged', amount: 90, color: '#fb923c', bg: 'transparent' }
          ];
          return { options };
        }
      }
    </script>
  </body>
</html>
