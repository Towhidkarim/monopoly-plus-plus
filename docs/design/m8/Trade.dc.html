<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trade table</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=Manrope:wght@400;600;800&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a1222; color: #f4ede2; font-family: 'Manrope', system-ui, sans-serif">
<img src="/_blob/282b5fd59a8a364586baba3721257d1f" alt="The board at night" style="position: absolute; left: 230px; top: 90px; width: 980px; height: 833px; object-fit: contain">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(6,10,20,0.72)"></div>

<section role="dialog" aria-label="Trade with Juno" style="position: absolute; left: 40px; right: 40px; top: 32px; bottom: 32px; display: flex; flex-direction: column; border-radius: 28px; background: #121c33; border: 1px solid rgba(255,214,150,0.16); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 30px 70px rgba(2,6,16,0.7); overflow: hidden">
<header style="display: flex; align-items: center; gap: 16px; padding: 18px 24px; border-bottom: 1px solid rgba(255,214,150,0.1)">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #f5b54a">Trade</span>
<span style="font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 700">Trade with</span>
</span>
<span style="display: flex; gap: 8px">
<sc-for list="{{partners}}" as="pt" hint-placeholder-count="3">
<button type="button" aria-pressed="{{pt.on}}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border-radius: 999px; border: 1.5px solid {{pt.border}}; background: {{pt.bg}}; color: #f4ede2; font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 800">
<span style="width: 28px; height: 28px; border-radius: 50%; background: {{pt.color}}"></span>{{pt.name}}</button>
</sc-for>
</span>
<span style="flex: 1"></span>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px dashed rgba(245,181,74,0.6); background: rgba(245,181,74,0.08); color: #ffcf70; font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700">
<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1 L8.6 5.2 L13 5.4 L9.6 8.2 L10.8 12.6 L7 10.1 L3.2 12.6 L4.4 8.2 L1 5.4 L5.4 5.2 Z" fill="#ffcf70"></path></svg>Ask Juno for Gallery Walk · completes Theater</button>
<button type="button" aria-label="Close" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,214,150,0.16); background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2 L12 12 M12 2 L2 12" stroke="#f4ede2" stroke-width="1.8" stroke-linecap="round"></path></svg></button>
</header>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr) 300px; gap: 0">
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid rgba(255,214,150,0.08)">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #a8b1c4">Your cards</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{mine}}" as="c" hint-placeholder-count="4">
<div style="width: 112px; height: 146px; opacity: {{c.dim}}">
<div style="transform: scale(0.8); transform-origin: top left">
<dc-import name="RichDeed" compact="{{true}}" street="{{c.street}}" group="{{c.group}}" color="{{c.color}}" ink="{{c.ink}}" price="{{c.price}}" level="{{c.level}}" owned="{{true}}" owner-color="#fb7185" night="{{true}}" selected="{{c.sel}}" hint-size="140px,182px"></dc-import>
</div>
</div>
</sc-for>
</div>
</div>

<div style="padding: 18px; display: flex; flex-direction: column">
<div style="flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 54px minmax(0, 1fr); gap: 0; align-items: stretch; border-radius: 24px; background: #173a35; background-image: radial-gradient(rgba(255,255,255,0.035) 1px, rgba(255,255,255,0) 1px); background-size: 6px 6px; box-shadow: inset 0 0 0 6px #122e2a, inset 0 0 0 7px rgba(255,255,255,0.08), inset 0 8px 24px rgba(0,0,0,0.35); padding: 20px">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 18px; border: 2px dashed rgba(251,113,133,0.55)">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #fda4af">You give</span>
<div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start">
<div style="transform: rotate(-4deg)">
<dc-import name="RichDeed" compact="{{true}}" street="Harbor Row" group="Docks" color="#a78bfa" ink="#1d1240" price="{{60}}" level="{{0}}" owned="{{true}}" owner-color="#fb7185" night="{{true}}" hint-size="140px,182px"></dc-import>
</div>
<span style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 14px; background: rgba(0,0,0,0.2)">
<span style="position: relative; width: 44px; height: 40px">
<span style="position: absolute; left: 4px; top: 16px; width: 36px; height: 18px; border-radius: 50%; background: #c8962a"></span>
<span style="position: absolute; left: 4px; top: 10px; width: 36px; height: 18px; border-radius: 50%; background: #e0ad3e"></span>
<span style="position: absolute; left: 4px; top: 4px; width: 36px; height: 18px; border-radius: 50%; background: #f2c14e; box-shadow: inset 0 -2px 0 #c8962a"></span>
</span>
<span style="font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; color: #ffcf70">₵50</span>
</span>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 6px">
<label style="flex: 1; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 12px; background: rgba(0,0,0,0.25)">
<span style="color: #a8b1c4">₵</span><input type="text" aria-label="You give: cash" value="50" style="width: 100%; border: 0; outline: none; background: transparent; color: #f4ede2; font-family: 'Sora', sans-serif; font-size: 15px"></label>
<button type="button" style="height: 40px; padding: 0 10px; border-radius: 12px; border: 0; background: #f2c14e; color: #3a2400; font-weight: 800; font-family: 'Manrope', sans-serif; box-shadow: inset 0 -3px 0 #c8962a">+10</button>
<button type="button" style="height: 40px; padding: 0 10px; border-radius: 12px; border: 0; background: #f2c14e; color: #3a2400; font-weight: 800; font-family: 'Manrope', sans-serif; box-shadow: inset 0 -3px 0 #c8962a">+50</button>
<button type="button" style="height: 40px; padding: 0 10px; border-radius: 12px; border: 0; background: #f2c14e; color: #3a2400; font-weight: 800; font-family: 'Manrope', sans-serif; box-shadow: inset 0 -3px 0 #c8962a">+100</button>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: center">
<svg width="34" height="60" viewBox="0 0 34 60" aria-hidden="true"><path d="M4 18 H28 M22 10 L30 18 L22 26 M30 42 H6 M12 34 L4 42 L12 50" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 18px; border: 2px dashed rgba(94,234,212,0.55)">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #5eead4">You get</span>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<div style="transform: rotate(3deg)">
<dc-import name="RichDeed" compact="{{true}}" street="Gallery Walk" group="Theater" color="#f87171" ink="#3a0c0c" price="{{220}}" level="{{0}}" owned="{{true}}" owner-color="#a78bfa" night="{{true}}" hint-size="140px,182px"></dc-import>
</div>
<div style="width: 140px; height: 182px; box-sizing: border-box; border-radius: 14px; border: 2px dashed rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; font-size: 12px; color: rgba(255,255,255,0.5)">Click Juno's cards to add them</div>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 6px">
<label style="flex: 1; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 12px; background: rgba(0,0,0,0.25)">
<span style="color: #a8b1c4">₵</span><input type="text" aria-label="You get: cash" placeholder="0" style="width: 100%; border: 0; outline: none; background: transparent; color: #f4ede2; font-family: 'Sora', sans-serif; font-size: 15px"></label>
<button type="button" style="height: 40px; padding: 0 10px; border-radius: 12px; border: 0; background: #f2c14e; color: #3a2400; font-weight: 800; font-family: 'Manrope', sans-serif; box-shadow: inset 0 -3px 0 #c8962a">+10</button>
<button type="button" style="height: 40px; padding: 0 10px; border-radius: 12px; border: 0; background: #f2c14e; color: #3a2400; font-weight: 800; font-family: 'Manrope', sans-serif; box-shadow: inset 0 -3px 0 #c8962a">+50</button>
<button type="button" style="height: 40px; padding: 0 10px; border-radius: 12px; border: 0; background: #f2c14e; color: #3a2400; font-weight: 800; font-family: 'Manrope', sans-serif; box-shadow: inset 0 -3px 0 #c8962a">+100</button>
</div>
</div>
</div>
</div>

<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; border-left: 1px solid rgba(255,214,150,0.08)">
<span style="display: flex; align-items: center; gap: 10px">
<span style="width: 40px; height: 40px; border-radius: 50%; background: #a78bfa; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 A6 6 0 0 1 18 9 C18 13 14 16 12 17 C10 16 6 13 6 9 A6 6 0 0 1 12 3 Z M10.5 17 L11 20 H13 L13.5 17" fill="none" stroke="#1a1020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span style="display: flex; flex-direction: column">
<span style="font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700">Juno's cards</span>
<span style="font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #a8b1c4">Shark bot</span>
</span>
</span>
<div style="position: relative; padding: 12px 14px; border-radius: 16px 16px 16px 4px; background: #fbf8f1; color: #1f2a3d; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; box-shadow: 0 8px 18px rgba(2,6,16,0.4)">“Gallery Walk? That's my favorite street. Sweeten it a little.”</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{theirs}}" as="c" hint-placeholder-count="2">
<div style="width: 112px; height: 146px; opacity: {{c.dim}}">
<div style="transform: scale(0.8); transform-origin: top left">
<dc-import name="RichDeed" compact="{{true}}" street="{{c.street}}" group="{{c.group}}" color="{{c.color}}" ink="{{c.ink}}" price="{{c.price}}" level="{{c.level}}" owned="{{true}}" owner-color="#a78bfa" night="{{true}}" selected="{{c.sel}}" hint-size="140px,182px"></dc-import>
</div>
</div>
</sc-for>
</div>
</div>
</div>

<footer style="display: flex; align-items: center; gap: 16px; padding: 16px 24px; border-top: 1px solid rgba(255,214,150,0.1); background: rgba(255,255,255,0.02)">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: rgba(245,181,74,0.14); color: #ffcf70; font-size: 12px; font-weight: 800"><span style="width: 10px; height: 10px; border-radius: 3px; background: #f87171"></span>Completes your Theater set</span>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: rgba(251,113,133,0.12); color: #fda4af; font-size: 12px; font-weight: 800"><span style="width: 10px; height: 10px; border-radius: 3px; background: #a78bfa"></span>Breaks up your Docks set</span>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px; max-width: 360px; margin: 0 auto">
<div style="position: relative; height: 12px; border-radius: 6px; background: linear-gradient(90deg, #fb7185, #f5b54a 55%, #5eead4)">
<span aria-hidden="true" style="position: absolute; left: 48%; top: -5px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: #fbf8f1; box-shadow: 0 0 0 4px rgba(245,181,74,0.5), 0 4px 8px rgba(0,0,0,0.4)"></span>
</div>
<span style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: #a8b1c4"><span>No way</span><span style="color: #ffcf70">Hmm…</span><span>Deal!</span></span>
</div>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(245,181,74,0.6); background: rgba(245,181,74,0.1); color: #ffcf70; font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 800">Add ₵40 to make it work</button>
<button type="button" style="height: 52px; padding: 0 18px; border-radius: 16px; border: 1px solid rgba(255,214,150,0.2); background: transparent; color: #f4ede2; font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 800">Cancel</button>
<button type="button" style="height: 56px; padding: 0 26px; border-radius: 16px; border: 0; background: #f5b54a; color: #1c1205; font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 700; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18), 0 10px 26px rgba(245,181,74,0.3)">Send offer</button>
</footer>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const partners = [
      { name: 'Nova', color: '#22d3ee', on: false, bg: 'transparent', border: 'rgba(255,214,150,0.16)' },
      { name: 'Atlas', color: '#fbbf24', on: false, bg: 'transparent', border: 'rgba(255,214,150,0.16)' },
      { name: 'Juno', color: '#a78bfa', on: true, bg: 'rgba(245,181,74,0.12)', border: '#f5b54a' }
    ];
    const mine = [
      { street: 'Foundry Way', group: 'Old Town', color: '#7dd3fc', ink: '#0b2a3a', price: 120, level: 2, sel: false, dim: 1 },
      { street: 'Mill Avenue', group: 'Old Town', color: '#7dd3fc', ink: '#0b2a3a', price: 100, level: 2, sel: false, dim: 1 },
      { street: 'Harbor Row', group: 'Docks', color: '#a78bfa', ink: '#1d1240', price: 60, level: 0, sel: true, dim: 0.35 },
      { street: 'Market Street', group: 'Market', color: '#fb923c', ink: '#3a1a05', price: 180, level: 0, sel: false, dim: 1 }
    ];
    const theirs = [
      { street: 'Gallery Walk', group: 'Theater', color: '#f87171', ink: '#3a0c0c', price: 220, level: 0, sel: true, dim: 0.35 },
      { street: 'Willow Place', group: 'Gardens', color: '#f472b6', ink: '#3a0a24', price: 140, level: 0, sel: false, dim: 1 }
    ];
    return { partners, mine, theirs };
  }
}
</script>
</body>
</html>
